# Jyotish-OS extension for IronClaw — wraps the jyotish-mcp server (docs/CONTRACT.md).
#
# Shape: IronClaw `reborn.extension_manifest.v3`, derived from the bundled
# hosted-MCP packages (crates/extensions/packages/{notion-mcp,nearai-mcp}/manifest.toml).
# A hosted-MCP package declares `[mcp]` instead of `[runtime]`; the `[[tools]]`
# entries are statically pinned so the ten contract tools are model-visible from
# first boot, and a successful `tools/list` discovery replaces them with the
# live catalog (tool ids become `jyotish.<mcp tool name>`).
#
# TRANSPORT (Phase 6, verified against ironclaw 1.4.0 — see ../README.md):
# IronClaw types `[mcp].server` as an https-only endpoint, so jyotish-mcp serves
# HTTPS on 127.0.0.1:7791 with a locally issued certificate (scripts/gen-cert.sh)
# and the IronClaw process trusts it via SSL_CERT_FILE=certs/ironclaw-ca-bundle.pem.
# This manifest installs and activates with all ten tools model-visible.
# KNOWN LIMIT: IronClaw 1.4.0's hosted-MCP egress policy still has
# deny_private_ip_ranges=true with no override, so a tool call to this loopback
# URL is refused *before* any TCP connection (`network_denied`, observed
# 2026-09-16 with both 127.0.0.1 and localhost). Do not bind non-loopback.

schema_version = "reborn.extension_manifest.v3"
id = "jyotish"
name = "Jyotish-OS"
version = "0.1.0"
description = "Jyotish-OS astrology tools: JPL-DE440 sidereal charts, panchanga, dasha, transits, muhurta, kuta matching, birth-time rectification, rule validation and engine consensus over the local jyotish-mcp server."
trust = "third_party"

[mcp]
# loop_run: the astrologer answering a chat turn; automation: cron/heartbeat
# routines (daily brief, weekly muhurta, nightly consensus). Both are gated
# behind an explicit grant. product (management surface) never calls tools.
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "gated_unless_granted" }
server = "https://127.0.0.1:7791/mcp"
namespace = "jyotish"
max_tools = 16
default_permission = "allow"
# Read-only computations; no credentials (jyotish-mcp is loopback, no auth).
effects = ["network"]

# ---------------------------------------------------------------------------
# Statically pinned tools — one per docs/CONTRACT.md "jyotish-mcp tools" entry.
# Schema/prompt refs follow the hosted-MCP discovery convention
# (`schemas/<ext>/<tool name with . -> />.input.v1.json`).
# ---------------------------------------------------------------------------

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "gated_unless_granted" }
id = "jyotish.chart.compute"
description = "Compute a sidereal (Lahiri, true nodes, JPL DE440) chart with rashi, nakshatra+pada, bhava cusps and boundary_distance_sec for every value."
default_permission = "allow"
input_schema_ref = "schemas/jyotish/chart/compute.input.v1.json"
prompt_doc_ref = "prompts/jyotish/chart/compute.md"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "gated_unless_granted" }
id = "jyotish.panchang.day"
description = "Daily panchanga for a place: tithi, nakshatra, yoga, karana with start/end instants, sunrise/sunset, hora table, rahu kala, abhijit."
default_permission = "allow"
input_schema_ref = "schemas/jyotish/panchang/day.input.v1.json"
prompt_doc_ref = "prompts/jyotish/panchang/day.md"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "gated_unless_granted" }
id = "jyotish.dasha.timeline"
description = "Nested dasha periods (55 systems; Vimshottari cross-checked XALEN vs PyJHora to <= 1 day) with UTC instants and balance at birth."
default_permission = "allow"
input_schema_ref = "schemas/jyotish/dasha/timeline.input.v1.json"
prompt_doc_ref = "prompts/jyotish/dasha/timeline.md"

[[tools]]
