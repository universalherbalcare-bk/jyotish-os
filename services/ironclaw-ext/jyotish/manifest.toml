input_schema_ref = "schemas/jyotish/transit/window.input.v1.json"
prompt_doc_ref = "prompts/jyotish/transit/window.md"

[[tools]]
origin_gate_matrix = { loop_run = "gated_unless_granted", product = "forbidden", automation = "gated_unless_granted" }
