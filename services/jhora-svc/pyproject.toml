[project]
name = "jhora-svc"
version = "0.1.0"
description = "Loopback-only PyJHora sidecar for JYOTISH-OS (port 7792). PyJHora (AGPL-3.0) stays an isolated process; nothing here is imported by other services."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pyswisseph==2.10.3.2",
  "numpy==2.1.1",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
# Makes this file the ruff config root so `ruff check .` here and pre-commit from the repo root agree
# (without it, first-party detection of `jhora_svc` depends on the working directory).
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["jhora_svc"]
