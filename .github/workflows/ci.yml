name: ci
on: [push, pull_request]

# Least privilege: nothing here writes to the repo. gitleaks-action only reads with GITHUB_TOKEN.
permissions:
  contents: read

# One live run per ref; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# vendor/ is git-ignored. Every job restores it with `scripts/vendor.sh --from-git`, which fetches the
# exact upstream commits pinned in vendor/UPSTREAM-PINS.txt (sparse, depth 1), installs the pinned
# vendor/xalen.Cargo.lock and hard-fails on any sentinel-hash mismatch. actions/cache is keyed on the
# pins so a cache hit costs only the sentinel re-check (the script is idempotent and skips matching trees).
# xalen's target/ is excluded from the cache so a cargo build never bloats it.

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: pins are well-formed (full 40-hex SHAs for all three upstreams)
        run: |
          for k in XALEN PYJHORA VEDASTRO; do
            grep -Eq "^${k}_COMMIT=[0-9a-f]{40}$" vendor/UPSTREAM-PINS.txt || { echo "vendor/UPSTREAM-PINS.txt: ${k}_COMMIT missing or not a full SHA"; exit 1; }
          done
          test -f vendor/xalen.Cargo.lock

  jyotish-mcp:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vendor/xalen
            !vendor/xalen/target
            vendor/pyjhora
            vendor/vedastro
          key: vendor-${{ hashFiles('vendor/UPSTREAM-PINS.txt', 'vendor/xalen.Cargo.lock') }}
      - name: restore vendor from pinned upstream commits
        run: scripts/vendor.sh --from-git
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: kernels/de440s.bsp
          key: de440s-${{ hashFiles('kernels/de440s.sha256') }}
      - name: kernel (DE440 from NAIF, pinned sha256)
        run: |
          mkdir -p kernels
          test -f kernels/de440s.bsp || curl -fL --retry 3 -o kernels/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
          shasum -a 256 -c kernels/de440s.sha256
      # In-process integration tests boot plain HTTP on a random loopback port; JYOTISH_TLS=off
      # documents that (the binary defaults to TLS on).
      - run: cd services/jyotish-mcp && cargo fmt --check && cargo clippy --all-targets -- -D warnings && JYOTISH_TLS=off cargo test
      - name: TLS smoke (Phase 6) — locally issued cert, SAN IP:127.0.0.1, key 0600, curl over https
        run: |
          set -euo pipefail
          scripts/gen-cert.sh
          cd services/jyotish-mcp && cargo build --release && cd ../..
          services/jyotish-mcp/target/release/jyotish-mcp > /tmp/jyotish-mcp-tls.log 2>&1 &
          for _ in $(seq 1 30); do sleep 1; curl -sf --cacert certs/jyotish-ca.crt https://127.0.0.1:7791/health >/dev/null && break; done
          curl -sf --cacert certs/jyotish-ca.crt https://127.0.0.1:7791/health | head -c 200; echo
          curl -sf --cacert certs/jyotish-ca.crt -X POST https://127.0.0.1:7791/mcp -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"catalog.list"'
          grep -q '"msg":"tls handshake"' /tmp/jyotish-mcp-tls.log
          # boot guard must refuse a world-readable key (exit 2)
          kill %1; wait %1 || true
          chmod 644 certs/jyotish-mcp.key
          set +e; JYOTISH_BIND=127.0.0.1:17791 services/jyotish-mcp/target/release/jyotish-mcp >/dev/null 2>&1; rc=$?; set -e
          test "$rc" -eq 2
      - run: cd vendor/xalen && cargo test --locked --workspace --exclude xalen-python --exclude xalen-node

  jhora-svc:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vendor/xalen
            !vendor/xalen/target
            vendor/pyjhora
            vendor/vedastro
          key: vendor-${{ hashFiles('vendor/UPSTREAM-PINS.txt', 'vendor/xalen.Cargo.lock') }}
      - name: restore vendor from pinned upstream commits
        run: scripts/vendor.sh --from-git
      - uses: astral-sh/setup-uv@v5
      - run: cd services/jhora-svc && ./setup_env.sh && uv pip install --python .venv/bin/python ruff && .venv/bin/ruff check . && .venv/bin/python -m pytest -q

  vedastro-svc:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vendor/xalen
            !vendor/xalen/target
            vendor/pyjhora
            vendor/vedastro
          key: vendor-${{ hashFiles('vendor/UPSTREAM-PINS.txt', 'vendor/xalen.Cargo.lock') }}
      - name: restore vendor from pinned upstream commits
        run: scripts/vendor.sh --from-git
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: cd services/vedastro-svc && dotnet build -warnaserror:CS8600,CS8602 && dotnet test
      - name: no vulnerable NuGet packages (the listing alone never fails; grep makes it a gate)
        run: |
          cd services/vedastro-svc
          out=$(dotnet list package --vulnerable --include-transitive)
          echo "$out"
          echo "$out" | grep -qi "has the following vulnerable packages" && { echo "vulnerable packages found"; exit 1; } || true
          echo "$out" | grep -qi "no vulnerable packages" || { echo "expected an explicit 'no vulnerable packages' verdict"; exit 1; }

  consensus:
    # Differential corpus gate (docs/CONTRACT.md "Consensus tolerances"): XALEN-DE440 vs jhora-svc on 500
    # seeded charts. The job is RED whenever any category exceeds its tolerance — tolerances are never
    # loosened here; UNDER REVIEW categories are decided in docs/CONTRACT.md, not by editing this job.
    runs-on: ubuntu-latest
    needs: [jyotish-mcp, jhora-svc]
    env:
      CONSENSUS_N: "500"
      CONSENSUS_SEED: "42"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vendor/xalen
            !vendor/xalen/target
            vendor/pyjhora
            vendor/vedastro
          key: vendor-${{ hashFiles('vendor/UPSTREAM-PINS.txt', 'vendor/xalen.Cargo.lock') }}
      - name: restore vendor from pinned upstream commits
        run: scripts/vendor.sh --from-git
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: kernels/de440s.bsp
          key: de440s-${{ hashFiles('kernels/de440s.sha256') }}
      - name: kernel (DE440 from NAIF, pinned sha256)
        run: |
          mkdir -p kernels
          test -f kernels/de440s.bsp || curl -fL --retry 3 -o kernels/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
          shasum -a 256 -c kernels/de440s.sha256
      - name: jhora-svc up
        run: |
          cd services/jhora-svc && ./setup_env.sh
          nohup ./run.sh > /tmp/jhora-svc.log 2>&1 &
          for _ in $(seq 1 180); do
            sleep 1
            curl -sf -m 3 http://127.0.0.1:7792/v1/health >/dev/null && exit 0
          done
          echo "jhora-svc did not become healthy"; cat /tmp/jhora-svc.log; exit 1
      - name: build corpus runner
        run: cd validation/consensus && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --release && cargo build --release
      - name: run corpus (fails on any category over tolerance)
        run: |
          validation/consensus/target/release/consensus-corpus --n "$CONSENSUS_N" --seed "$CONSENSUS_SEED" \
            --csv validation/ci-consensus-corpus.csv --summary validation/ci-consensus-summary.md | tail -n 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-corpus
          path: |
            validation/ci-consensus-corpus.csv
            validation/ci-consensus-summary.md
            /tmp/jhora-svc.log

  compose-build:
    # Phase 8 production topology (deploy/compose.yaml + the three Dockerfiles) must build from a clean
    # checkout. Fails closed if the compose file is absent — it is a required status check for main.
    runs-on: ubuntu-latest
    needs: gates
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            vendor/xalen
            !vendor/xalen/target
            vendor/pyjhora
            vendor/vedastro
          key: vendor-${{ hashFiles('vendor/UPSTREAM-PINS.txt', 'vendor/xalen.Cargo.lock') }}
      - name: restore vendor from pinned upstream commits
        run: scripts/vendor.sh --from-git
      - name: compose file present and valid
        run: |
          test -f deploy/compose.yaml || { echo "deploy/compose.yaml missing"; exit 1; }
          docker compose -f deploy/compose.yaml --profile corpus config -q
      - name: build all images (including the corpus profile)
        run: docker compose -f deploy/compose.yaml --profile corpus build --pull
