name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  jyotish-mcp:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - name: restore vendor (archives must be provided as CI artifacts or a private mirror)
        run: |
          test -d vendor/xalen || { echo "vendor/ missing — upload source archives and run scripts/vendor.sh"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: kernel
        run: |
          mkdir -p kernels && curl -L -o kernels/de440s.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
          shasum -a 256 -c kernels/de440s.sha256
      - run: cd services/jyotish-mcp && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - run: cd vendor/xalen && cargo test --workspace --exclude xalen-python --exclude xalen-node
  jhora-svc:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - run: test -d vendor/pyjhora || { echo "vendor/ missing"; exit 1; }
      - uses: astral-sh/setup-uv@v5
      - run: cd services/jhora-svc && uv venv --python 3.12 && . .venv/bin/activate && uv pip install -r ../../vendor/pyjhora/requirements.txt -e ../../vendor/pyjhora fastapi uvicorn pytest httpx && ruff check . && pytest -q
  vedastro-svc:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - run: test -d vendor/vedastro || { echo "vendor/ missing"; exit 1; }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: cd services/vedastro-svc && dotnet build -warnaserror:CS8600,CS8602 && dotnet test && dotnet list package --vulnerable --include-transitive
  consensus:
    runs-on: ubuntu-latest
    needs: [jyotish-mcp, jhora-svc]
    steps:
      - uses: actions/checkout@v4
      - run: echo "differential corpus runner is wired in validation/ (Phase 4) — see validation/README.md"
