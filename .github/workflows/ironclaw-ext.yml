name: ironclaw-ext static gate

on:
  push:
    paths:
      - "services/ironclaw-ext/**"
      - ".github/workflows/ironclaw-ext.yml"
  pull_request:
    paths:
      - "services/ironclaw-ext/**"
      - ".github/workflows/ironclaw-ext.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifest / schema / routine / persona consistency with docs/CONTRACT.md
        run: ./services/ironclaw-ext/check.sh
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
